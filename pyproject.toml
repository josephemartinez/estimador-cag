[project]
name = "estimador-cag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.6.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "litellm>=1.105.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "sse-starlette>=3.5.0",
    "streamlit>=1.65.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "pytest>=9.1.1",
]
   [tool.pytest.ini_options]
   pythonpath = ["."]
   testpaths = ["tests"]